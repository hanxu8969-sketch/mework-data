<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeWork</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f6f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MeWork">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
</head>
<body class="viz">
<header class="topbar">
  <div class="brand">MeWork <span class="sub">个人任务看板</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="brief" role="tab">📰 简报 Briefing</button>
    <button class="tab" data-view="today" role="tab">今日 Today</button>
    <button class="tab" data-view="timeline" role="tab">时间线 Timeline</button>
    <button class="tab" data-view="projects" role="tab">项目 Projects</button>
  </nav>
</header>

<main id="main">
  <section id="view-brief" class="view"></section>
  <section id="view-today" class="view" hidden></section>
  <section id="view-timeline" class="view" hidden></section>
  <section id="view-projects" class="view" hidden></section>
</main>

<aside id="drawer" class="drawer" hidden aria-label="任务详情"></aside>
<div id="drawer-mask" class="drawer-mask" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
