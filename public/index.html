<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeWork</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">MeWork <span class="sub">个人任务看板</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="today" role="tab">今日 Today</button>
    <button class="tab" data-view="timeline" role="tab">时间线 Timeline</button>
    <button class="tab" data-view="projects" role="tab">项目 Projects</button>
  </nav>
</header>

<main id="main">
  <section id="view-today" class="view"></section>
  <section id="view-timeline" class="view" hidden></section>
  <section id="view-projects" class="view" hidden></section>
</main>

<aside id="drawer" class="drawer" hidden aria-label="任务详情"></aside>
<div id="drawer-mask" class="drawer-mask" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
